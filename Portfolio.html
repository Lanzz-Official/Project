<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>R - LANZZ | Portfolio</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@300;500;700&display=swap');:root{--bg:#05060f;--glass:rgba(15,18,35,0.55);--text:#e8ecff;--neon:#00f0ff}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Poppins';padding-bottom:120px}#matrix{position:fixed;inset:0;z-index:-1;opacity:.15}nav{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(25px);padding:10px 15px;border-radius:50px;border:1px solid var(--neon);z-index:999;display:flex;gap:12px;overflow-x:auto;max-width:95%}nav a{color:var(--text);text-decoration:none;font-size:.9rem}nav a.active{color:var(--neon)}section{padding:120px 20px 20px;max-width:1100px;margin:auto}h2{font-family:'Orbitron';font-size:2.5rem;text-align:center;margin-bottom:40px;color:var(--neon)}.card{background:var(--glass);backdrop-filter:blur(25px);padding:25px;border-radius:20px;border:1px solid var(--neon);margin-bottom:20px}.fab{position:fixed;bottom:20px;left:20px;width:50px;height:50px;border-radius:50%;background:var(--neon);border:none}#musicBtn{bottom:80px}input,textarea{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:1px solid var(--neon);background:transparent;color:var(--text)}.btn{padding:12px 25px;border:2px solid var(--neon);border-radius:50px;background:transparent;color:var(--neon)}</style></head><body><canvas id="matrix"></canvas><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="portfolio.html" class="active">Portfolio</a><a href="galeri.html">Galeri</a><a href="blog.html">Blog</a><a href="contact.html">Contact</a></nav><section><h2>PORTFOLIO</h2><div class="card"><h3>Mod Menu ML</h3><p>Script mod menu dengan fitur aimbot, skin unlock</p></div><div class="card"><h3>Website Sultan</h3><p>Website personal dengan efek neon dan panel admin</p></div><h3 style="margin-top:40px">Kirim Pesan</h3><input id="namaPesan" placeholder="Nama"><textarea id="pesan" placeholder="Pesan"></textarea><button onclick="kirimWA()" class="btn">Kirim ke WA</button></section><button id="panelBtn" class="fab"><i class="fa fa-gear"></i></button><button id="musicBtn" class="fab"><i class="fa fa-music"></i></button><audio id="bgm" loop><source src="https://cdn.pixabay.com/audio/2025/08/23/audio_7ac1d0f2b2.mp3"></audio><script>function kirimWA(){let n=namaPesan.value,p=pesan.value;window.open(`https://wa.me/6283894480846?text=Halo ${n}: ${p}`)};const c=document.getElementById('matrix'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let str="01".split(""),fs=14,cols=c.width/fs,drop=[];for(let i=0;i<cols;i++)drop[i]=1;setInterval(()=>{x.fillStyle="rgba(5,6,15,0.05)";x.fillRect(0,0,c.width,c.height);x.fillStyle='var(--neon)';for(let i=0;i<drop.length;i++){x.fillText(str[Math.floor(Math.random()*str.length)],i*fs,drop[i]*fs);if(drop[i]*fs>c.height)drop[i]=0;drop[i]++}},35);let m=false;musicBtn.onclick=()=>{m?bgm.pause():bgm.play();m=!m};panelBtn.onclick=()=>panel.style.display='block'</script></body></html>
